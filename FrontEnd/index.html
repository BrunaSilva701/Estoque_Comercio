<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Inventário Simples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>ESTOQUE iTECHNOS</h1>

        <div id="secaoCadastrar">
            <h2>Cadastrar Novo Produto</h2>
            <form id="formProduto" onsubmit="cadastrarProduto(event)">
                <div class="form-group">
                    <label for="descricao">Nome do Produto:</label>
                    <input type="text" id="descricao" required>
                </div>
                <div class="form-group">
                    <label for="marca">Fabricante:</label>
                    <input type="text" id="marca" required>
                </div>
                 <div class="form-group">
                    <label for="cor">Cor:</label>
                    <input type="text" id="cor" required>
                </div>
                <div class="form-group">
                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="1" required>
                </div>
                <div class="form-group">
                    <label for="preco">Preço:</label>
                    <input type="number" id="preco" min="1" required>
                </div>
                <button type="submit" class="btn-cadastrar">Cadastrar Produto</button>
            </form>
        </div>

        <div id="secaoEditar" style="display: none;">
            <h2>Editar Produto (<span id="edit-id-label"></span>)</h2>
            <form id="formEditarProduto" onsubmit="salvarEdicao(event)">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-descricao">Nome do Produto:</label>
                    <input type="text" id="edit-descricao" required>
                </div>
                <div class="form-group">
                    <label for="edit-marca">Fabricante:</label>
                    <input type="text" id="edit-marca" required>
                </div>
                  <div class="form-group">
                    <label for="edit-cor">Cor:</label>
                    <input type="text" id="edit-cor" required>
                </div>
                <div class="form-group">
                    <label for="edit-quantidade">Quantidade:</label>
                    <input type="number" id="edit-quantidade" min="1" required>
                </div>
                <div class="form-group">
                    <label for="edit-preco">Preço:</label>
                    <input type="number" id="edit-preco" min="1" required>
                </div>
                <button type="submit" class="btn-salvar">Salvar Alterações</button>
                <button type="button" class="btn-cancelar" onclick="fecharEdicao()">Cancelar</button>
            </form>
        </div>

        <div class="busca-container">
            <input type="text" id="inputBusca" placeholder="Pesquisar por ID ou Descrição...">
            <button class="btn-buscar" onclick="buscarProduto()">Buscar</button>
            <button class="btn-limpar" onclick="limparBusca()">Limpar</button>
        </div>

        <h2>Produtos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>CÓDIGO</th>
                    <th>DESCRIÇÃO</th>
                    <th>MARCA</th>
                    <th>COR</th>
                    <th>QUANTIDADE</th>
                    <th>PREÇO</th>
                    <th>AÇÕES</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos">
                </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
